<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выбор карт Таро</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 Выберите 3 карты</h1>
            <p class="subtitle">Коснитесь карт, чтобы выбрать их для расклада</p>
        </div>
        
        <div class="cards-container">
            <div class="cards-grid" id="cardsGrid">
                <!-- Карты будут добавлены через JavaScript -->
            </div>
        </div>
        
        <div class="selection-info" id="selectionInfo">
            <div class="counter">
                <span id="selectedCount">0</span> / 3
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="action-area">
            <button class="continue-btn" id="continueBtn" disabled>
                <span class="btn-text">Продолжить</span>
                <span class="btn-icon">✨</span>
            </button>
        </div>
        
        <!-- Модальное окно для показа выбранных карт -->
        <div class="modal" id="revealModal" style="display: none;">
            <div class="modal-content">
                <h2>Ваши карты</h2>
                <div class="selected-cards" id="selectedCardsDisplay">
                    <!-- Выбранные карты будут показаны здесь -->
                </div>
                <button class="modal-btn" id="confirmBtn">Получить расклад</button>
            </div>
        </div>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.ready();
        Telegram.expand();

        // Тестовые карты Таро
        const allCards = [
            { slug: 'the-fool', name: 'Дурак', image: 'the-fool.svg' },
            { slug: 'the-magician', name: 'Маг', image: 'the-magician.svg' },
            { slug: 'the-high-priestess', name: 'Верховная Жрица', image: 'the-high-priestess.svg' },
            { slug: 'the-empress', name: 'Императрица', image: 'the-empress.svg' },
            { slug: 'the-emperor', name: 'Император', image: 'the-emperor.svg' },
            { slug: 'the-hierophant', name: 'Иерофант', image: 'the-hierophant.svg' },
            { slug: 'the-lovers', name: 'Влюбленные', image: 'the-lovers.svg' },
            { slug: 'the-chariot', name: 'Колесница', image: 'the-chariot.svg' },
            { slug: 'strength', name: 'Сила', image: 'strength.svg' },
            { slug: 'the-hermit', name: 'Отшельник', image: 'the-hermit.svg' }
        ];

        let selectedCards = [];
        const maxCards = 3;

        function initCards() {
            const grid = document.getElementById('cardsGrid');
            
            // Выбираем 7 рандомных карт из всех 10
            const shuffled = [...allCards].sort(() => 0.5 - Math.random());
            const displayCards = shuffled.slice(0, 7);
            
            displayCards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.slug = card.slug;
                cardElement.dataset.cardData = JSON.stringify(card);
                
                cardElement.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">
                            <div class="card-back-design">
                                <div class="mystical-pattern">
                                    <div class="pattern-circle"></div>
                                    <div class="pattern-lines"></div>
                                    <div class="pattern-stars">✦</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-front">
                            <div class="card-image">
                                <img src="static/cards/${card.image}" alt="${card.name}" onerror="this.style.backgroundImage='linear-gradient(45deg, #6a5acd, #9370db)'">
                            </div>
                            <div class="card-name">${card.name}</div>
                        </div>
                    </div>
                    <div class="selection-indicator">
                        <div class="selection-number">${index + 1}</div>
                    </div>
                `;
                
                cardElement.addEventListener('click', () => toggleCard(cardElement, card));
                grid.appendChild(cardElement);
                
                // Добавляем небольшую задержку для анимации появления
                setTimeout(() => {
                    cardElement.classList.add('appear');
                }, index * 100);
            });
        }

        function toggleCard(cardElement, card) {
            const isSelected = selectedCards.some(c => c.slug === card.slug);
            
            if (isSelected) {
                // Убираем карту
                selectedCards = selectedCards.filter(c => c.slug !== card.slug);
                cardElement.classList.remove('selected');
                
                // Анимация снятия выделения
                cardElement.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    cardElement.style.transform = '';
                }, 200);
            } else {
                // Добавляем карту, если не превышен лимит
                if (selectedCards.length < maxCards) {
                    selectedCards.push({ slug: card.slug, reversed: false });
                    cardElement.classList.add('selected');
                    
                    // Анимация выбора
                    cardElement.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        cardElement.style.transform = 'scale(1.05)';
                    }, 200);
                } else {
                    // Анимация "нельзя выбрать"
                    cardElement.style.transform = 'translateX(-10px)';
                    setTimeout(() => {
                        cardElement.style.transform = 'translateX(10px)';
                        setTimeout(() => {
                            cardElement.style.transform = '';
                        }, 100);
                    }, 100);
                }
            }
            
            updateUI();
        }

        function updateUI() {
            const selectedCount = document.getElementById('selectedCount');
            const continueBtn = document.getElementById('continueBtn');
            const progressFill = document.getElementById('progressFill');
            
            selectedCount.textContent = selectedCards.length;
            
            // Обновляем прогресс-бар
            const progress = (selectedCards.length / maxCards) * 100;
            progressFill.style.width = progress + '%';
            
            if (selectedCards.length === maxCards) {
                continueBtn.disabled = false;
                continueBtn.classList.add('enabled');
                
                // Анимация готовности
                continueBtn.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    continueBtn.style.transform = '';
                }, 300);
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.remove('enabled');
            }
        }

        function showSelectedCards() {
            const modal = document.getElementById('revealModal');
            const selectedCardsDisplay = document.getElementById('selectedCardsDisplay');
            
            // Очищаем предыдущие карты
            selectedCardsDisplay.innerHTML = '';
            
            // Показываем выбранные карты с анимацией переворота
            selectedCards.forEach((selectedCard, index) => {
                const cardData = JSON.parse(document.querySelector(`[data-slug="${selectedCard.slug}"]`).dataset.cardData);
                
                const cardElement = document.createElement('div');
                cardElement.className = 'revealed-card';
                cardElement.innerHTML = `
                    <div class="card-inner flipping">
                        <div class="card-back">
                            <div class="card-back-design">
                                <div class="mystical-pattern">
                                    <div class="pattern-circle"></div>
                                    <div class="pattern-lines"></div>
                                    <div class="pattern-stars">✦</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-front">
                            <div class="card-image">
                                <img src="static/cards/${cardData.image}" alt="${cardData.name}">
                            </div>
                            <div class="card-name">${cardData.name}</div>
                        </div>
                    </div>
                `;
                
                selectedCardsDisplay.appendChild(cardElement);
                
                // Анимация переворота с задержкой
                setTimeout(() => {
                    cardElement.querySelector('.card-inner').classList.add('flipped');
                }, index * 300 + 500);
            });
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function sendData() {
            if (selectedCards.length === maxCards) {
                const data = {
                    cards: selectedCards
                };
                
                Telegram.sendData(JSON.stringify(data));
                Telegram.close();
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', initCards);
        document.getElementById('continueBtn').addEventListener('click', showSelectedCards);
        document.getElementById('confirmBtn').addEventListener('click', sendData);
    </script>
</body>
</html>
