<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
    <defs>
        <linearGradient id="grad67" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="black" flood-opacity="0.3"/>
        </filter>
    </defs>
    <rect width="200" height="300" fill="url(#grad67)" rx="15" ry="15" filter="url(#shadow)"/>
    <rect x="10" y="10" width="180" height="280" fill="none" stroke="white" stroke-width="2" rx="10" ry="10" opacity="0.3"/>
    
    <!-- Название карты -->
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Pentacles</text>
    <text x="100" y="150" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Four Of Pentacles</text>
    
    <!-- Декоративные элементы -->
    <circle cx="100" cy="80" r="25" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="220" r="25" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    
    <!-- Углы -->
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.6">✦</text>
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.6">✦</text>
    <text x="20" y="280" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.6">✦</text>
    <text x="180" y="280" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.6">✦</text>
    
    <!-- Центральный символ -->
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.7">🔮</text>
</svg>