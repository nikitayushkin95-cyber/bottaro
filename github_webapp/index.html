<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор карт Таро</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 Выберите 3 карты</h1>
            <p>Коснитесь карт для выбора</p>
        </div>
        
        <div class="cards-grid" id="cardsGrid">
            <!-- Cards will be generated by JavaScript -->
        </div>
        
        <div class="selected-info" id="selectedInfo" style="display: none;">
            <p>Выбрано карт: <span id="selectedCount">0</span>/3</p>
        </div>
        
        <div class="continue-section" id="continueSection" style="display: none;">
            <button class="continue-btn" id="continueBtn">Продолжить</button>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Card data
        const cards = [
            { slug: "the-fool", name: "Дурак", image: "the-fool.jpg" },
            { slug: "the-magician", name: "Маг", image: "the-magician.jpg" },
            { slug: "the-high-priestess", name: "Верховная Жрица", image: "the-high-priestess.jpg" },
            { slug: "the-empress", name: "Императрица", image: "the-empress.jpg" },
            { slug: "the-emperor", name: "Император", image: "the-emperor.jpg" },
            { slug: "the-lovers", name: "Влюбленные", image: "the-lovers.jpg" },
            { slug: "justice", name: "Справедливость", image: "justice.jpg" },
            { slug: "the-hermit", name: "Отшельник", image: "the-hermit.jpg" },
            { slug: "the-world", name: "Мир", image: "the-world.jpg" },
            { slug: "wheel-of-fortune", name: "Колесо Фортуны", image: "wheel-of-fortune.jpg" },
            { slug: "queen-of-pentacles", name: "Королева Пентаклей", image: "queen-of-pentacles.jpg" },
            { slug: "six-of-swords", name: "6 Мечей", image: "six-of-swords.jpg" }
        ];

        let selectedCards = [];
        const maxCards = 3;

        // Generate cards grid
        function generateCardsGrid() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.slug = card.slug;
                cardElement.dataset.index = index;
                
                cardElement.innerHTML = `
                    <div class="card-back">
                        <div class="card-pattern"></div>
                    </div>
                    <div class="card-front" style="display: none;">
                        <img src="static/cards/${card.image}" alt="${card.name}" onerror="this.style.display='none'">
                        <div class="card-name">${card.name}</div>
                    </div>
                `;
                
                cardElement.addEventListener('click', () => toggleCard(cardElement, card));
                grid.appendChild(cardElement);
            });
        }

        // Toggle card selection
        function toggleCard(cardElement, card) {
            const isSelected = cardElement.classList.contains('selected');
            
            if (isSelected) {
                // Deselect card
                cardElement.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c.slug !== card.slug);
            } else {
                // Check if we can select more cards
                if (selectedCards.length >= maxCards) {
                    return; // Can't select more cards
                }
                
                // Select card
                cardElement.classList.add('selected');
                selectedCards.push({
                    slug: card.slug,
                    reversed: false
                });
            }
            
            updateUI();
        }

        // Update UI based on selection
        function updateUI() {
            const selectedCount = selectedCards.length;
            const selectedInfo = document.getElementById('selectedInfo');
            const continueSection = document.getElementById('continueSection');
            const continueBtn = document.getElementById('continueBtn');
            const selectedCountSpan = document.getElementById('selectedCount');
            
            selectedCountSpan.textContent = selectedCount;
            
            if (selectedCount > 0) {
                selectedInfo.style.display = 'block';
            } else {
                selectedInfo.style.display = 'none';
            }
            
            if (selectedCount === maxCards) {
                continueSection.style.display = 'block';
            } else {
                continueSection.style.display = 'none';
            }
        }

        // Continue button handler
        document.getElementById('continueBtn').addEventListener('click', () => {
            if (selectedCards.length === maxCards) {
                // Send data to Telegram
                const data = {
                    cards: selectedCards
                };
                
                tg.sendData(JSON.stringify(data));
                tg.close();
            }
        });

        // Initialize the app
        generateCardsGrid();
    </script>
</body>
</html>
